services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: 4med
      POSTGRES_PASSWORD: desenvolvimento
      POSTGRES_DB: 4med
    ports: ["5432:5432"]
    volumes: ["dados-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U 4med"]
      interval: 5s
      retries: 10
volumes:
  dados-postgres:
