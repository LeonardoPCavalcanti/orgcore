packages:
  - contracts
  - api
  - web
allowBuilds:
  argon2: true
  esbuild: true
  protobufjs: false
  sharp: true

# Transitivas com aviso de seguranca e sem versao nova no pacote que as puxa
# (fastify -> fast-uri, mammoth -> xmldom, satori -> fflate).
overrides:
  fast-uri: '>=4.1.2'
  '@xmldom/xmldom': '>=0.8.15'
  fflate: '>=0.7.5'
